# Ne pas commiter le vrai secret. Créer le secret K8s avec la commande suivante :
#
# kubectl create secret generic auth-secrets \
#   --namespace=urbanflow \
#   --from-literal=JWT_SECRET='<valeur>' \
#   --from-literal=RABBIT_MQ='amqp://urban:<password>@192.168.0.249:5672'
apiVersion: v1
kind: Secret
metadata:
  name: auth-secrets
  namespace: urbanflow
type: Opaque
data:
  JWT_SECRET: <BASE64_ENCODED>
  RABBIT_MQ: <BASE64_ENCODED>
