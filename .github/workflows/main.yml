name: Deploy changed services

on:
  push:
    branches:
      - develop

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.changes.outputs.gateway }}
      auth: ${{ steps.changes.outputs.auth }}
      user: ${{ steps.changes.outputs.user }}
      logs: ${{ steps.changes.outputs.logs }}
      trips: ${{ steps.changes.outputs.trips }}
      trips-planner: ${{ steps.changes.outputs.trips-planner }}
      notifications: ${{ steps.changes.outputs.notifications }}
      monitoring: ${{ steps.changes.outputs.monitoring }}
      incidents: ${{ steps.changes.outputs.incidents }}
      docker-compose: ${{ steps.changes.outputs.docker-compose }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive
          ssh-key: ${{ secrets.SSH_DEPLOY_KEY }}

      - name: Detect changed submodules
        id: changes
        run: |
          CHANGED=$(git diff HEAD~1 HEAD --name-only)
          echo "$CHANGED"

          check() {
            echo "$CHANGED" | grep -qc "^modules/$1" && echo "true" || echo "false"
          }

          echo "gateway=$(check gateway)" >> $GITHUB_OUTPUT
          echo "auth=$(check auth)" >> $GITHUB_OUTPUT
          echo "user=$(check user)" >> $GITHUB_OUTPUT
          echo "logs=$(check logs)" >> $GITHUB_OUTPUT
          echo "trips=$(check trips)" >> $GITHUB_OUTPUT
          echo "trips-planner=$(check trips-planner)" >> $GITHUB_OUTPUT
          echo "notifications=$(check notifications)" >> $GITHUB_OUTPUT
          echo "monitoring=$(check monitoring)" >> $GITHUB_OUTPUT
          echo "incidents=$(check incidents)" >> $GITHUB_OUTPUT
          echo "docker-compose=$(echo "$CHANGED" | grep -qc 'docker-compose.yml' && echo true || echo false)" >> $GITHUB_OUTPUT

  deploy:
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ssh-key: ${{ secrets.SSH_DEPLOY_KEY }}

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy changed services via SSH
        run: |
            sshpass -p "${{ secrets.PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.USERNAME }}@${{ secrets.HOST }} << 'EOF'
            cd UrbanFlow-base
            git stash
            git stash clear

            git pull origin develop
            git submodule update --init --recursive

            redeploy() {
              SERVICE=$1
              echo "🚀 Redeploying $SERVICE..."
              docker compose up -d --build $SERVICE
            }
            
            ${{ needs.detect-changes.outputs.gateway == 'true' && 'redeploy gateway-service' || '# gateway unchanged' }}
            ${{ needs.detect-changes.outputs.auth == 'true' && 'redeploy auth-service' || '# auth unchanged' }}
            ${{ needs.detect-changes.outputs.user == 'true' && 'redeploy user-service' || '# user unchanged' }}
            ${{ needs.detect-changes.outputs.logs == 'true' && 'redeploy logs-service' || '# logs unchanged' }}
            ${{ needs.detect-changes.outputs.trips == 'true' && 'redeploy trips-service' || '# trips unchanged' }}
            ${{ needs.detect-changes.outputs['trips-planner'] == 'true' && 'redeploy trips-planner-service' || '# trips-planner unchanged' }}
            ${{ needs.detect-changes.outputs.notifications == 'true' && 'redeploy notification-service' || '# notifications unchanged' }}
            ${{ needs.detect-changes.outputs.monitoring == 'true' && 'redeploy monitoring-service' || '# monitoring unchanged' }}
            ${{ needs.detect-changes.outputs.incidents == 'true' && 'redeploy incident-service' || '# incidents unchanged' }}

            ${{ needs.detect-changes.outputs['docker-compose'] == 'true' && 'docker compose up -d --build' || '# docker-compose unchanged' }}
            EOF
