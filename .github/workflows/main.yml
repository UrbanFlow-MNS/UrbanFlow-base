name: Deploy changed services

on:
  push:
    branches:
      - develop

jobs:
  detect-backend:
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.check.outputs.any }}
      services: ${{ steps.check.outputs.services }}
      deploy_all: ${{ steps.check.outputs.deploy_all }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect backend changes
        id: check
        run: |
          CHANGED=$(git diff HEAD~1 HEAD --name-only)
          echo "Changed files: $CHANGED"

          check() {
            echo "$CHANGED" | grep -q "^modules/$1" && echo "true" || echo "false"
          }

          SERVICES=""
          [ "$(check gateway)" = "true" ]       && SERVICES="$SERVICES gateway-service"
          [ "$(check user)" = "true" ]           && SERVICES="$SERVICES user-service"
          [ "$(check logs)" = "true" ]           && SERVICES="$SERVICES logs-service"
          [ "$(check trips)" = "true" ]          && SERVICES="$SERVICES trips-service"
          [ "$(check trips-planner)" = "true" ]  && SERVICES="$SERVICES trips-planner-service"
          [ "$(check notifications)" = "true" ]  && SERVICES="$SERVICES notification-service"
          [ "$(check monitoring)" = "true" ]     && SERVICES="$SERVICES monitoring-service"
          [ "$(check incidents)" = "true" ]      && SERVICES="$SERVICES incident-service"

          SERVICES="${SERVICES# }"

          if echo "$CHANGED" | grep -q 'docker-compose.yml'; then
            echo "deploy_all=true" >> $GITHUB_OUTPUT
            echo "any=true" >> $GITHUB_OUTPUT
          else
            echo "deploy_all=false" >> $GITHUB_OUTPUT
            [ -n "$SERVICES" ] && echo "any=true" >> $GITHUB_OUTPUT || echo "any=false" >> $GITHUB_OUTPUT
          fi

          echo "services=${SERVICES// /,}" >> $GITHUB_OUTPUT

  detect-frontend:
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.check.outputs.any }}
      services: ${{ steps.check.outputs.services }}
      deploy_all: ${{ steps.check.outputs.deploy_all }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect frontend changes
        id: check
        run: |
          CHANGED=$(git diff HEAD~1 HEAD --name-only)
          echo "Changed files: $CHANGED"

          check_frontend() {
            echo "$CHANGED" | grep -q "^frontend/$1" && echo "true" || echo "false"
          }

          SERVICES=""
          [ "$(check_frontend auth)" = "true" ]       && SERVICES="$SERVICES auth-frontend"
          [ "$(check_frontend user)" = "true" ]       && SERVICES="$SERVICES user-frontend"
          [ "$(check_frontend monitoring)" = "true" ] && SERVICES="$SERVICES monitoring-frontend"
          [ "$(check_frontend incidents)" = "true" ]  && SERVICES="$SERVICES incidents-frontend"

          SERVICES="${SERVICES# }"

          if echo "$CHANGED" | grep -q 'docker-compose.yml'; then
            echo "deploy_all=true" >> $GITHUB_OUTPUT
            echo "any=true" >> $GITHUB_OUTPUT
          else
            echo "deploy_all=false" >> $GITHUB_OUTPUT
            [ -n "$SERVICES" ] && echo "any=true" >> $GITHUB_OUTPUT || echo "any=false" >> $GITHUB_OUTPUT
          fi

          echo "services=${SERVICES// /,}" >> $GITHUB_OUTPUT

  deploy-backend:
    needs: detect-backend
    if: needs.detect-backend.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy backend via SSH
        run: |
          sshpass -p "${{ secrets.PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.USERNAME }}@${{ secrets.HOST }} bash << 'EOF'
            set -e
            cd School/UrbanFlow-base

            echo "📥 Pulling base repo..."
            git pull origin develop

            echo "📥 Pulling submodules..."
            git submodule update --init --recursive
            git submodule foreach '
              git checkout develop
              git pull origin develop
            '

            echo "🗄️  Ensuring databases and backups are up..."
            docker compose -f docker-compose.databases.yml up -d

            SERVICES="${{ needs.detect-backend.outputs.services }}"
            DEPLOY_ALL="${{ needs.detect-backend.outputs.deploy_all }}"

            echo "🔍 Backend services to deploy: $SERVICES"
            echo "🔍 Deploy all: $DEPLOY_ALL"

            if [ "$DEPLOY_ALL" = "true" ]; then
              echo "🚀 docker-compose changed, redeploying all backend services..."
              docker compose \
                -f docker-compose.tools.yml \
                -f docker-compose.databases.yml \
                -f docker-compose.backend.yml \
                up -d --build \
                gateway-service user-service logs-service \
                trips-service trips-planner-service notification-service \
                monitoring-service incident-service
            else
              for SERVICE in $(echo "$SERVICES" | tr ',' ' '); do
                echo "🚀 Redeploying $SERVICE..."
                docker compose \
                  -f docker-compose.tools.yml \
                  -f docker-compose.databases.yml \
                  -f docker-compose.backend.yml \
                  up -d --build "$SERVICE"
              done
            fi
          EOF

  deploy-frontend:
    needs: [detect-frontend, deploy-backend]
    if: |
      always() &&
      needs.detect-frontend.outputs.any == 'true' &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy frontend via SSH
        run: |
          sshpass -p "${{ secrets.PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.USERNAME }}@${{ secrets.HOST }} bash << 'EOF'
            set -e
            cd School/UrbanFlow-base

            echo "📥 Pulling base repo..."
            git pull origin develop

            echo "📥 Pulling submodules..."
            git submodule update --init --recursive
            git submodule foreach '
              git checkout develop
              git pull origin develop
            '

            SERVICES="${{ needs.detect-frontend.outputs.services }}"
            DEPLOY_ALL="${{ needs.detect-frontend.outputs.deploy_all }}"

            echo "🔍 Frontend services to deploy: $SERVICES"
            echo "🔍 Deploy all: $DEPLOY_ALL"

            if [ "$DEPLOY_ALL" = "true" ]; then
              echo "🚀 docker-compose changed, redeploying all frontend services..."
              docker compose \
                -f docker-compose.frontend.yml \
                up -d --build \
                auth-frontend user-frontend monitoring-frontend incidents-frontend
            else
              for SERVICE in $(echo "$SERVICES" | tr ',' ' '); do
                echo "🚀 Redeploying $SERVICE..."
                docker compose \
                  -f docker-compose.frontend.yml \
                  up -d --build "$SERVICE"
              done
            fi
          EOF
