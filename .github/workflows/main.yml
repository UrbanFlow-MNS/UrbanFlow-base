name: Deploy changed services

on:
  push:
    branches:
      - develop

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.changes.outputs.gateway }}
      auth: ${{ steps.changes.outputs.auth }}
      user: ${{ steps.changes.outputs.user }}
      logs: ${{ steps.changes.outputs.logs }}
      trips: ${{ steps.changes.outputs.trips }}
      trips-planner: ${{ steps.changes.outputs.trips-planner }}
      notifications: ${{ steps.changes.outputs.notifications }}
      monitoring: ${{ steps.changes.outputs.monitoring }}
      incidents: ${{ steps.changes.outputs.incidents }}
      docker-compose: ${{ steps.changes.outputs.docker-compose }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive
          ssh-key: ${{ secrets.SSH_DEPLOY_KEY }}

      - name: Detect changed submodules
        id: changes
        run: |
          CHANGED=$(git diff HEAD~1 HEAD --name-only)
          echo "$CHANGED"

          check() {
            echo "$CHANGED" | grep -qc "^modules/$1" && echo "true" || echo "false"
          }

          echo "gateway=$(check gateway)" >> $GITHUB_OUTPUT
          echo "auth=$(check auth)" >> $GITHUB_OUTPUT
          echo "user=$(check user)" >> $GITHUB_OUTPUT
          echo "logs=$(check logs)" >> $GITHUB_OUTPUT
          echo "trips=$(check trips)" >> $GITHUB_OUTPUT
          echo "trips-planner=$(check trips-planner)" >> $GITHUB_OUTPUT
          echo "notifications=$(check notifications)" >> $GITHUB_OUTPUT
          echo "monitoring=$(check monitoring)" >> $GITHUB_OUTPUT
          echo "incidents=$(check incidents)" >> $GITHUB_OUTPUT
          echo "docker-compose=$(echo "$CHANGED" | grep -qc 'docker-compose.yml' && echo true || echo false)" >> $GITHUB_OUTPUT

  deploy:
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Build services list
        id: services
        run: |
          SERVICES=""
          ${{ needs.detect-changes.outputs.gateway == 'true' && 'SERVICES="$SERVICES gateway-service"' || '' }}
          ${{ needs.detect-changes.outputs.auth == 'true' && 'SERVICES="$SERVICES auth-service"' || '' }}
          ${{ needs.detect-changes.outputs.user == 'true' && 'SERVICES="$SERVICES user-service"' || '' }}
          ${{ needs.detect-changes.outputs.logs == 'true' && 'SERVICES="$SERVICES logs-service"' || '' }}
          ${{ needs.detect-changes.outputs.trips == 'true' && 'SERVICES="$SERVICES trips-service"' || '' }}
          ${{ needs.detect-changes.outputs['trips-planner'] == 'true' && 'SERVICES="$SERVICES trips-planner-service"' || '' }}
          ${{ needs.detect-changes.outputs.notifications == 'true' && 'SERVICES="$SERVICES notification-service"' || '' }}
          ${{ needs.detect-changes.outputs.monitoring == 'true' && 'SERVICES="$SERVICES monitoring-service"' || '' }}
          ${{ needs.detect-changes.outputs.incidents == 'true' && 'SERVICES="$SERVICES incident-service"' || '' }}
          echo "list=$SERVICES" >> $GITHUB_OUTPUT
          echo "deploy_all=${{ needs.detect-changes.outputs['docker-compose'] }}" >> $GITHUB_OUTPUT

      - name: Deploy via SSH
        env:
          SERVICES: ${{ steps.services.outputs.list }}
          DEPLOY_ALL: ${{ steps.services.outputs.deploy_all }}
        run: |
          sshpass -p "${{ secrets.PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.USERNAME }}@${{ secrets.HOST }} \
            SERVICES="$SERVICES" DEPLOY_ALL="$DEPLOY_ALL" bash << 'EOF'
            set -e
            cd UrbanFlow-base

            echo "📥 Pulling base repo..."
            git pull

            echo "📥 Pulling submodules..."
            git submodule update --init --recursive
            git submodule foreach '
              git checkout develop
              git pull
            '

            if [ "$DEPLOY_ALL" = "true" ]; then
              echo "🚀 docker-compose changed, redeploying all services..."
              docker compose up -d --build
            elif [ -n "$SERVICES" ]; then
              for SERVICE in $SERVICES; do
                echo "🚀 Redeploying $SERVICE..."
                docker compose up -d --build $SERVICE
              done
            else
              echo "✅ No service to redeploy."
            fi
          EOF
