services:
  keycloak-service:
    image: quay.io/keycloak/keycloak:24.0
    env_file:
      - .env.docker.keycloak
    command: ["start-dev", "--http-port", "7080", "--https-port", "7443"]
    ports:
      - "7080:7080"
      - "7443:7443"
    networks:
      - local_network

networks:
  local_network:
    driver: bridge